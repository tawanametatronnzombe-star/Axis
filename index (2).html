<style>
:root{--bg:#15171a;--ink:#ecebe6;--mute:#9aa0a6;--line:#2c3036;--acc:#7ea6cf;--pad:clamp(20px,5vw,72px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Helvetica Neue",Arial,sans-serif}
a{color:inherit}:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--ink);color:var(--bg);padding:8px;z-index:9}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:12px var(--pad);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none}.brand svg{width:30px;height:30px}
.brand span{font-weight:300;letter-spacing:.32em;font-size:14px}
nav{display:flex;flex-wrap:wrap}nav a{padding:13px 10px;text-decoration:none;font-size:13px;letter-spacing:.06em;color:var(--mute)}
nav a[aria-current],nav a:hover{color:var(--ink)}
main{min-height:70vh;outline:0}section{padding:clamp(48px,9vw,120px) var(--pad);border-bottom:1px solid var(--line)}
h1,h2,h3{font-weight:300;letter-spacing:-.02em;line-height:1.05;margin:0 0 .5em}
h1{font-size:clamp(40px,9vw,128px)}h2{font-size:clamp(28px,4.5vw,56px)}h3{font-size:22px}
p{max-width:62ch;color:var(--mute)}
.hero{min-height:82vh;display:flex;flex-direction:column;justify-content:flex-end;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--line) calc(25% - 1px) 25%)}
.hero p{font-size:18px}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-block;min-height:48px;padding:13px 26px;border:1px solid var(--ink);text-decoration:none;font-size:13px;letter-spacing:.12em;background:none;color:var(--ink);cursor:pointer;font-family:inherit}
.btn.p{background:var(--ink);color:var(--bg)}.btn:hover{border-color:var(--acc)}
.bar{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:32px}
label{display:grid;gap:6px;font-size:13px;color:var(--mute)}
select,input,textarea{background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--mute);padding:12px 0;font:inherit;min-height:48px;border-radius:0}
select option{color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.card{background:var(--bg);text-decoration:none;display:block}
.ph{aspect-ratio:16/10;background:linear-gradient(135deg,#1d2025,#262b31);display:grid;place-items:center;color:var(--mute);font-size:12px;letter-spacing:.14em;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.card .b{padding:20px}.card h3{margin:8px 0}.meta{font-size:13px;color:var(--mute)}
.st{font-size:11px;letter-spacing:.14em;border:1px solid var(--line);padding:3px 8px;display:inline-block}
.st.AVAILABLE{border-color:var(--acc);color:var(--acc)}.st.SOURCING{border-style:dashed}
dl{display:grid;grid-template-columns:max-content 1fr;gap:10px 32px;border-top:1px solid var(--line);padding-top:20px}dt{color:var(--mute)}dd{margin:0}
.demo{background:var(--line);padding:10px var(--pad);font-size:13px}
form{display:grid;gap:22px;max-width:640px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
ol.steps{list-style:none;padding:0;max-width:720px;counter-reset:s}ol.steps li{border-top:1px solid var(--line);padding:18px 0 18px 56px;position:relative}
ol.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;color:var(--acc)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:40px}
footer{padding:40px var(--pad);font-size:13px;color:var(--mute)}
@media(max-width:600px){.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){.hero h1{animation:in 1s ease both}@keyframes in{from{opacity:0;transform:translateY(14px)}}}

<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"AXIS Automotive Group","founder":[{"@type":"Person","name":"Tawananyasha Nzombe"},{"@type":"Person","name":"Angel Rubaya"}]}</script>
</head><body>

<header><a class="brand" href="#/" aria-label="AXIS home"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square" aria-hidden="true"><path d="M10 54 32 8l22 46"/><path d="M2 40h60"/></svg><span>AXIS</span></a><nav id="nav" aria-label="Main"></nav></header>
<div class="demo" id="demo" hidden>Sample inventory shown for layout only. Not real stock.</div>
<main id="app" tabindex="-1"></main>
<footer>AXIS Automotive Group. Sourcing arrangements are discussed directly with the AXIS team.</footer>
<script>
const STOCK={"meta":{"updated":"2026-09-30","demo":true,"note":"Sample entries for layout only. Not real inventory."},
"vehicles":[
{"id":"demo-001","make":"Sample Make A","model":"Saloon Demo","year":2024,"body":"Saloon","power":"Petrol","trans":"Automatic","mileage":"12,000 km","status":"AVAILABLE","location":"To be confirmed","updated":"2026-09-30","image":"","desc":"Demonstration listing showing how a physically available vehicle appears. Replace with real stock."},
{"id":"demo-002","make":"Sample Make B","model":"SUV Demo","year":2025,"body":"SUV","power":"Hybrid","trans":"Automatic","mileage":"New","status":"IN TRANSIT","location":"In transit","updated":"2026-09-29","image":"","desc":"Demonstration listing for a vehicle currently being shipped."},
{"id":"demo-003","make":"Sample Make C","model":"Electric Demo","year":2025,"body":"Hatchback","power":"Electric","trans":"Automatic","mileage":"New","status":"ARRIVING","location":"Arriving","updated":"2026-09-28","image":"","desc":"Demonstration listing for a vehicle nearing arrival."},
{"id":"demo-004","make":"Sample Make D","model":"Pickup Demo","year":2023,"body":"Pickup","power":"Diesel","trans":"Manual","mileage":"30,000 km","status":"SOURCING","location":"Not yet held by AXIS","updated":"2026-09-27","image":"","desc":"Demonstration of a sourcing-only listing. AXIS does not hold this vehicle."}
]};
const WA={m:"263719519301",b:"263788678472"};
const $=s=>document.querySelector(s),app=$("#app");
const e=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let D={vehicles:[],meta:{}};
const nav=["Live Stock","Source a Vehicle","How It Works","About","Contact"],slug=n=>n.toLowerCase().replace(/ /g,"-");
const cls=s=>e(s.replace(" ","-"));
const wa=(n,t)=>`https://wa.me/${n}?text=${encodeURIComponent(t)}`;
const ph=v=>v.image?`<img loading="lazy" src="${e(v.image)}" alt="${e(v.year+" "+v.make+" "+v.model)}">`:"PHOTO TO BE ADDED";
const card=v=>`<a class="card" href="#/vehicle/${e(v.id)}"><div class="ph">${ph(v)}</div><div class="b"><span class="st ${cls(v.status)}">${e(v.status)}</span><h3>${e(v.make)} ${e(v.model)}</h3><div class="meta">${e(v.year)} · ${e(v.body)} · ${e(v.power)} · ${e(v.trans)}</div><div class="meta">Updated ${e(v.updated)}</div></div></a>`;
const H=t=>`<h1 style="font-size:clamp(36px,7vw,88px)">${t}</h1>`;
const R={
"":()=>`<section class="hero"><h1>Engineered movement.<br>Sourced with control.</h1><p>AXIS connects customers with vehicles through sourcing and automotive services. Tell us what you need, or see what is moving through our stock.</p><div class="btns"><a class="btn p" href="#/live-stock">VIEW LIVE STOCK</a><a class="btn" href="#/source-a-vehicle">REQUEST A VEHICLE</a></div></section><section><h2>Held, moving, or sourced on request.</h2><p>Every vehicle carries an honest status, so you always know whether it is physically available or still being sourced.</p></section>`,
"live-stock":()=>{const f=k=>[...new Set(D.vehicles.map(v=>v[k]))].map(x=>`<option>${e(x)}</option>`).join("");
return `<section>${H("Live Stock")}<p id="cnt"></p><div class="bar"><label>Status<select id="fs"><option value="">All</option>${["AVAILABLE","IN TRANSIT","ARRIVING","RESERVED","SOLD","SOURCING"].map(s=>`<option>${s}</option>`).join("")}</select></label><label>Body<select id="fb"><option value="">All</option>${f("body")}</select></label><label>Powertrain<select id="fp"><option value="">All</option>${f("power")}</select></label><label>Sort<select id="so"><option value="u">Recently updated</option><option value="y">Year, newest</option></select></label></div><div class="grid" id="lst"></div><p>Stock loads from a static data file and changes when the site is updated. It is not a real-time feed.</p></section>`},
"vehicle":id=>{const v=D.vehicles.find(x=>x.id===id);if(!v)return `<section>${H("Vehicle not found")}<a class="btn" href="#/live-stock">BACK TO LIVE STOCK</a></section>`;
const n=`${v.year} ${v.make} ${v.model}`;document.title=n+" | AXIS Automotive Group";
return `<section><div class="ph" style="aspect-ratio:21/9;margin-bottom:32px">${ph(v)}</div><span class="st ${cls(v.status)}">${e(v.status)}</span><h1 style="font-size:clamp(32px,6vw,72px)">${e(v.make)} ${e(v.model)}</h1><p>${e(v.desc)}</p><dl><dt>Year</dt><dd>${e(v.year)}</dd><dt>Body</dt><dd>${e(v.body)}</dd><dt>Powertrain</dt><dd>${e(v.power)}</dd><dt>Transmission</dt><dd>${e(v.trans)}</dd><dt>Mileage</dt><dd>${e(v.mileage)}</dd><dt>Location</dt><dd>${e(v.location)}</dd><dt>Last updated</dt><dd>${e(v.updated)}</dd></dl><div class="btns"><a class="btn p" href="${wa(WA.b,"Hello AXIS, I would like to request: "+n+" ("+v.id+")")}" rel="noopener">REQUEST THIS VEHICLE</a><a class="btn" href="#/contact">CONTACT OUR TEAM</a></div></section>`},
"source-a-vehicle":()=>`<section>${H("Source a vehicle")}<p>Tell us what you are looking for. This starts a conversation. It does not purchase a vehicle.</p><form id="sf"><div class="two"><label>Name<input name="Name" required autocomplete="name"></label><label>WhatsApp / Phone<input name="Phone" type="tel" required autocomplete="tel"></label></div><label>Email<input name="Email" type="email" autocomplete="email"></label><div class="two"><label>Manufacturer<input name="Manufacturer"></label><label>Model<input name="Model"></label></div><div class="two"><label>Year<input name="Year" inputmode="numeric"></label><label>Budget<input name="Budget"></label></div><div class="two"><label>Vehicle type<input name="Vehicle type"></label><label>Fuel / powertrain<select name="Powertrain"><option>Any</option><option>Petrol</option><option>Diesel</option><option>Hybrid</option><option>Electric</option></select></label></div><label>Transmission<select name="Transmission"><option>Any</option><option>Automatic</option><option>Manual</option></select></label><label>Additional requirements<textarea name="Notes" rows="4"></textarea></label><button class="btn p" type="submit">START THE CONVERSATION</button><p>Submitting opens WhatsApp with your details pre-filled. This website stores nothing.</p></form></section>`,
"how-it-works":()=>`<section>${H("How it works")}<ol class="steps"><li>Tell us what you want.</li><li>We identify suitable vehicles.</li><li>Vehicle information is reviewed.</li><li>Sourcing and import details are discussed.</li><li>The process is coordinated.</li><li>The vehicle is delivered through the agreed process.</li></ol><p>Terms, costs, timelines and requirements are agreed directly with AXIS for each vehicle.</p></section>`,
"about":()=>`<section>${H("About AXIS")}<p>AXIS Automotive Group is a young company with a long-term automotive vision: sourcing and importing first, with a wider automotive group to be built over time.</p></section><section class="cols"><div><h2>Metatron878</h2><p>Tawananyasha Nzombe<br>Technical &amp; Digital Operations</p></div><div><h2>Billionaire Sukhs</h2><p>Angel Rubaya<br>Business &amp; Strategic Operations</p></div></section>`,
"contact":()=>`<section>${H("Contact")}<div class="cols"><div><h3>Metatron878</h3><p>Technical &amp; Digital Operations</p><div class="btns"><a class="btn p" href="${wa(WA.m,"Hello AXIS")}" rel="noopener">WHATSAPP</a><a class="btn" href="tel:+263719519301">CALL +263 71 951 9301</a></div></div><div><h3>Billionaire Sukhs</h3><p>Business &amp; Strategic Operations</p><div class="btns"><a class="btn p" href="${wa(WA.b,"Hello AXIS")}" rel="noopener">WHATSAPP</a><a class="btn" href="tel:+263788678472">CALL +263 78 867 8472</a></div></div></div><p>Company email to be announced.</p></section>`};
function list(){const g=i=>$(i).value;const r=D.vehicles.filter(v=>(!g("#fs")||v.status===g("#fs"))&&(!g("#fb")||v.body===g("#fb"))&&(!g("#fp")||v.power===g("#fp")));
r.sort(g("#so")==="y"?(a,b)=>b.year-a.year:(a,b)=>b.updated.localeCompare(a.updated));
$("#lst").innerHTML=r.map(card).join("")||"<p style='padding:20px'>No vehicles match these filters. Clear a filter or request a vehicle.</p>";
$("#cnt").textContent=`${D.vehicles.length} listed, ${D.vehicles.filter(v=>v.status==="AVAILABLE").length} physically available. Data updated ${D.meta.updated}.`}
function route(){const p=location.hash.replace(/^#\/?/,"").split("/"),k=p[0],fn=R[k]||R[""];
const t=nav.find(n=>slug(n)===k);document.title=(t?t+" | ":"")+"AXIS Automotive Group";
app.innerHTML=fn(p[1]);window.scrollTo(0,0);
document.querySelectorAll("nav a").forEach(a=>a.toggleAttribute("aria-current",a.getAttribute("href")==="#/"+k));
if(k==="live-stock"){list();document.querySelectorAll(".bar select").forEach(s=>s.onchange=list)}
const f=$("#sf");if(f)f.onsubmit=ev=>{ev.preventDefault();let t="AXIS vehicle request:\n";new FormData(f).forEach((v,k)=>{if(v)t+=k+": "+v+"\n"});open(wa(WA.b,t),"_blank","noopener")}}
$("#nav").innerHTML=nav.map(n=>`<a href="#/${slug(n)}">${n}</a>`).join("");
D=STOCK;$("#demo").hidden=!D.meta.demo;route();
addEventListener("hashchange",route);
</script></body></html>
